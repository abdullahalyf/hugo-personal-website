# Canonical, Open Graph and sitemap URLs must be absolute, so baseURL needs a
# real origin. Deployments override it with HUGO_BASEURL (Vercel sets this
# automatically); local development falls back to the placeholder below.
baseURL = "https://example.com/"
relativeURLs = false
theme = "folio"
title = "Tanvir Rahman"
defaultContentLanguage = "en"
enableRobotsTXT = true

# Site metadata comes from data/profile.yaml; these are only fallbacks.
[pagination]
  pagerSize = 10

[params]
  style = "harbor"
  locale = "en-US"
  description = "Tanvir Rahman — CSE student and web developer in Dhaka, Bangladesh."

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
      block = true
      title = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[menu]
  [[menu.main]]
    name = "Home"
    pageRef = "/"
    weight = 10
  [[menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 20
  [[menu.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 30
  [[menu.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 40
  [[menu.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 50

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

# No taxonomies: the site has no tag or category pages.
[taxonomies]
  tag = ""
  category = ""
