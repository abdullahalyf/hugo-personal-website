<!DOCTYPE html>
<html lang="{{ site.Params.locale | default "en" }}"
      data-style="{{ .Site.Params.style | default "harbor" }}"
      data-theme="light">
<head>
  {{ partial "head.html" . }}
  {{ partial "validate.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "scripts.html" . }}
</body>
</html>
