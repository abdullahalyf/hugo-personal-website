bio: |                             # required; first paragraph is shown on Home
  I'm a Computer Science student who likes turning messy real-world problems into simple software. Most of my work is small web apps for people I know: shops, clubs and classmates.

  I started with a lost-and-found board for my campus because things kept disappearing between the canteen and the library. It turned into a Laravel app with 300 students on it, and after that I stopped looking for big ideas and started looking for small problems that already have an audience.

  Outside class I work with our programming club, take part in the university's contest once a year, and write about what I break along the way. I want to work as a backend engineer after graduation, ideally on a team where shipping is more important than pitching.

