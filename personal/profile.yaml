# ============================================================
#  ALL personal content for this site lives in THIS file.
#  Photos and CV are NOT named here. Drop files with FIXED names into this folder:
#    personal/photos/profile.jpg        (required)
#    personal/photos/project-1.jpg ...  (1 = first project below, 2 = second ...)
#    personal/photos/hobby-1.jpg ...    (same order as hobbies below)
