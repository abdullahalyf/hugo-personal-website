bio: |
  I'm a Computer Science student at Daffodil International University, and
  most of what I have learned so far I have learned by building things and
  by competing. C, C++ and Java are my working languages, and I care more
  about understanding an algorithm properly than about the number of
  frameworks I have tried.

  My results have moved in one direction so far. Semester CGPA went from
  3.50 in my first semester to 3.89 in my fourth, and each semester has
  been better than the one before it — first programming fundamentals, then
  problem solving, then data structures, then algorithms.

  I keep showing up at programming contests. "Unlock the Algorithm", an
  algorithm contest organised by DIU, and "Take Off", the university's
  problem-solving event, are two I have taken part in, and I am a regular
  at the hackathons that come through the department. Every one of them has
  taught me more about reading a problem carefully than any textbook
  chapter did.

  Outside of it I ride motorcycles, and I am a firm believer in the way
  Cristiano Ronaldo works — the same effort on an ordinary Tuesday as on
  the day of a final. I want to go into software engineering after
  graduation, on a team where the code is read as carefully as it is
  written.

