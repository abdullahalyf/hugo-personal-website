bio: 'I''m a Computer Science student at Daffodil International University. I work in C, C++ and Java, and I enjoy problems where the answer has to be reasoned out step by step.


  My semester CGPA has risen every term, from 3.08 in the first semester to 3.40 in the fourth, with programming fundamentals, problem solving, data structures and algorithms along the way.


  Most of my projects so far were built for courses, several of them together with a classmate. I want to keep learning by building, and to work on a team where the code is read as carefully as it is written.

  '
